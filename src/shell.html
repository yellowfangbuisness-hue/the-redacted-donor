<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="__CSP__"><meta name="theme-color" content="#16120e"><title>The Redacted Donor</title><style>__CSS__</style></head>
<body>
<main id="game" aria-label="The Redacted Donor game">
  <canvas id="world" aria-label="First-person game world" tabindex="-1"></canvas>
  <div id="vignette" aria-hidden="true"></div><div id="gaze" aria-hidden="true"><i class="gaze-edge"></i><i class="gaze-eye"></i></div><div id="flash" aria-hidden="true"></div>
  <div id="title" class="title-screen">
    <div class="cover"></div>
    <div class="menu-frame"><div class="frame-corner a"></div><div class="frame-corner b"></div><div class="frame-corner c"></div><div class="frame-corner d"></div></div>
    <div class="title-content"><div class="logo-mark" aria-hidden="true"><i></i><span>Detective adventure</span></div>
      <div class="imprint"><span class="deco-mark" aria-hidden="true">✦</span><span>A noir investigation</span><i></i></div>
      <h1><span class="the">The</span><span class="redact">Redacted</span><span>Donor</span></h1>
      <div class="menu-buttons"><button id="begin" class="menu-primary"><span id="beginText">Begin the investigation</span></button><button id="records" class="menu-link">Records</button><button id="account" class="menu-link">Sign in</button><button id="controls" class="menu-link">Controls</button><button id="newGame" class="menu-link" hidden>Start a new investigation</button></div>
      <button id="comfortToggle" class="comfort-toggle veteran-toggle" aria-pressed="false"><span class="comfort-name">Veteran Investigator Mode <b>Off</b></span><small>Larger text, a closer view of every object, buttons instead of drags, extra time before the guard spots you</small></button>
      <button id="spatialToggle" class="comfort-toggle spatial-toggle" aria-pressed="false"><span class="comfort-name">Spatial Hand Tracking <b>Off</b></span><small>Webcam required. Pinch to grab, turn and pull. Mouse and keyboard keep working.</small></button><p id="spatialNote" role="status" hidden></p>
    </div>
    <button id="titleSound" class="sound-button" aria-label="Toggle sound"><span class="sound-bars"><i></i><i></i><i></i><i></i></span><span>Sound on</span></button>
    <p id="bootError" role="alert" hidden></p>
  </div>
  <div id="hud" hidden>
    <div class="hud-left"><div class="who"><span class="diamond-frame"><svg class="portrait" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="31" class="portrait-bg"/>
      <g class="face-mateo"><path d="M7 64C9 51 19 46 32 46S55 51 57 64Z" fill="#d9d3c4"/><path d="M25 46 32 55 39 46" fill="none" stroke="#9c9686" stroke-width="2"/><rect x="28" y="38" width="8" height="10" rx="3" fill="#a87f5d"/><ellipse cx="32" cy="30" rx="10" ry="12" fill="#b88d69"/><path d="M21 29C19 17 26 13 33 13 41 13 46 19 43 30 41 24 37 21.5 32 22 27 22 23 25 21 29Z" fill="#1d1712"/><circle cx="24" cy="20" r="3" fill="#1d1712"/><circle cx="29" cy="15.5" r="3" fill="#1d1712"/><circle cx="37" cy="15" r="3" fill="#1d1712"/><path d="M26.5 28.5h4M33.5 28.5h4" stroke="#2a1d14" stroke-width="1.6" stroke-linecap="round"/><circle cx="28.5" cy="31" r="1.2" fill="#1d1712"/><circle cx="35.5" cy="31" r="1.2" fill="#1d1712"/><path d="M29.5 37.5q2.5 1.4 5 0" fill="none" stroke="#6d4a33" stroke-width="1.3" stroke-linecap="round"/></g>
      <g class="face-detective"><path d="M6 64C8 50 19 45 32 45S56 50 58 64Z" fill="#4a3d2f"/><path d="M23 46 32 59 41 46 37 45 32 53 27 45Z" fill="#2b2219"/><path d="M30.6 50h2.8l1 10-2.4 2.4-2.4-2.4Z" fill="#7a2f22"/><rect x="28" y="37" width="8" height="10" rx="3" fill="#9c7656"/><ellipse cx="32" cy="30" rx="10" ry="12" fill="#a98262"/><ellipse cx="32" cy="27" rx="10.5" ry="3.6" fill="#0006"/><path d="M19 23C19 12 24 8 32 8S45 12 45 23Z" fill="#2a231c"/><path d="M27 10.5q5 3.5 10 0" fill="none" stroke="#17120e" stroke-width="1.6"/><rect x="19" y="19" width="26" height="3.4" fill="#6b4e2f"/><ellipse cx="32" cy="23" rx="20" ry="4.2" fill="#1f1a15"/><path d="M28 40.5q4-1.5 8 0" fill="none" stroke="#3b2a1d" stroke-width="2" stroke-linecap="round"/></g>
    </svg></span><div class="who-text"><b id="whoName">Mateo</b><span class="hud-label" id="role">Memory</span><div id="bulbs" aria-label="Composure"><i></i><i></i><i></i></div></div></div></div>
    <div class="hud-right"><div id="counter">0</div><div class="hud-label">case weight</div><button id="veteranHud" class="veteran-toggle veteran-hud" aria-pressed="false">Veteran mode <b>Off</b></button><button id="spatialHud" class="veteran-hud spatial-toggle" aria-pressed="false">Hand tracking <b>Off</b></button></div>
    <div class="objective"><div class="hud-label"><span id="chapter"></span> <span id="leadCount"></span></div><div id="objective"></div><div id="place"></div></div>
    <div id="timepiece" hidden><svg viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="skyDial" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c27a"/><stop offset=".5" stop-color="#e9c27a"/><stop offset=".5" stop-color="#1d2a3a"/><stop offset="1" stop-color="#1d2a3a"/></linearGradient></defs><circle cx="28" cy="28" r="25" class="dial-face"/><circle cx="28" cy="28" r="26.5" class="dial-ring"/><circle id="shiftArc" cx="28" cy="28" r="26.5" class="dial-arc" pathLength="100"/><path d="M3 28h50" class="dial-horizon"/><g class="dial-ticks"><path d="M28 5v4M28 47v4M5 28h4M47 28h4"/></g><g id="hand"><path d="M28 28L28 47" class="dial-hand"/><circle cx="28" cy="46" r="4.2" class="dial-sun"/></g><circle cx="28" cy="28" r="2.4" class="dial-pin"/></svg><div class="time-read"><span class="hud-label"><b id="timeGlyph">☀</b> <span id="phaseName">Day</span></span><strong id="clock">06:00</strong><small id="nextShift"></small></div></div>
    <div id="reticle"></div><div id="markerLayer" aria-hidden="true"></div>
    <div id="pointer" hidden aria-hidden="true"><i class="arrow"><svg viewBox="0 0 40 40"><path d="M6 20L30 8 25 20 30 32Z"/></svg></i><b>0 m</b></div>
    <div id="danger" hidden><span class="danger-eye" aria-hidden="true"><i></i></span><div><b id="dangerText">Footsteps in the corridor</b><small id="dangerHint"></small><i><em></em></i></div></div>
    <div id="prompt" hidden><kbd class="mouse" aria-label="Click"><svg viewBox="0 0 16 22" width="12" height="16" aria-hidden="true"><rect x="1" y="1" width="14" height="20" rx="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 1v8M1.5 9h13" stroke="currentColor" stroke-width="1.6"/><rect x="1.8" y="1.8" width="5.4" height="6.6" rx="2.5" fill="currentColor"/></svg></kbd><span></span></div>
    <div id="held" hidden>Holding <b></b>. Hold the mouse button to aim, release to throw.</div>
    <div id="caption" role="status" hidden><b></b><span></span></div>
    <div id="spatialView" hidden><canvas width="176" height="132" aria-hidden="true"></canvas><span id="spatialStatus" role="status"></span></div>
    <div id="hands" hidden><b id="handsTitle"></b><span id="handsHint"></span><span id="handsSay" role="status"></span><div id="handsVet"></div><button id="handsBack" class="text-btn" type="button">Step back <kbd>Esc</kbd></button></div>
    <div class="bottom-keys"><button id="hudJournal"><kbd>J</kbd> Journal</button><button id="hudKit" hidden><kbd>B</kbd> Kit</button><button id="hudPause"><kbd>Esc</kbd> Pause</button></div>
    <div id="touchControls"><div id="stick"><i></i></div><button id="touchCrouch" aria-label="Crouch">↓</button><button id="touchUse" aria-label="Interact">E</button></div>
  </div>
  <div id="cinema" aria-live="polite"><div class="bar top"></div><div class="bar bottom"><div class="cine-copy"><small id="cineKicker"></small><strong id="cineTitle"></strong><span id="cineLine"></span></div><span class="cine-skip"><kbd>E</kbd> to skip</span></div><div class="cine-fx"></div></div>
  <div id="fade" aria-hidden="true"></div>
  <div id="chapterCard" hidden><small></small><strong></strong><i></i></div>
  <div id="inspectHud" hidden><div><small>Under the desk lamp</small><h2></h2><p></p><div class="exposure"><i></i></div><b></b></div><div class="inspect-controls"><button id="turnLeft" aria-label="Rotate left">←</button><span>Drag to turn it</span><button id="turnRight" aria-label="Rotate right">→</button><button id="turnOver">Turn over <kbd>F</kbd></button><button id="leaveInspect">Set down <kbd>Esc</kbd></button></div></div>
  <div id="overlay" hidden><section id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><div id="panelBody"></div></section></div>
  <div id="sr" class="sr" aria-live="polite"></div>
</main><script type="module">__BUNDLE__</script></body></html>
